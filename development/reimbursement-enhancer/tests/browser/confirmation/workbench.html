<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>发票确认动画验证 · 合成数据</title><link rel="stylesheet" href="/extension/polish.css"><style>body{margin:0;background:#f4f6fa;font:16px system-ui;color:#253247}header{padding:22px 32px;background:#084988;color:white}main{max-width:980px;margin:24px auto;padding:24px;background:white;border-radius:8px}button{cursor:pointer;padding:10px 16px;border:1px solid #ccd5e0;border-radius:5px;margin:4px;background:white;color:#1765e8}.iframe-box{width:100%;height:440px;border:1px solid #dae1eb}.iframe-box1{width:100%;height:180px;border:0}aside{padding:12px;background:#fff7e8;color:#895300}section{margin:18px 0}</style>
<header>报销插件 0.11.5 · 确认反馈验证</header><main><aside>合成票据演示：不会连接学校接口，不会保存或提交报销数据。</aside><section><button id="success">模拟请求成功</button><button id="failure">模拟请求失败</button><button id="ready">完成预览更新</button><button id="reopen">重新打开票夹</button></section><p id="requests">确认请求次数：0</p><iframe title="发票夹" class="iframe-box" src="/bill-wallet-web/picker.html#/bill/list"></iframe><h3>影像信息</h3><iframe title="票据预览" class="iframe-box1" src="/bill-wallet-web/preview.html#/bill/listDetails"></iframe></main>
<script>window.chrome={storage:{local:{get:async defaults=>defaults},onChanged:{addListener(){}}}};</script><script src="/extension/wallet-feedback.js"></script>
<script>
const picker=document.querySelector('.iframe-box'),preview=document.querySelector('.iframe-box1');
function send(frame,action){frame.contentWindow.postMessage({demo:action},location.origin)}
success.onclick=()=>send(picker,'success');failure.onclick=()=>send(picker,'failure');ready.onclick=()=>send(preview,'ready');reopen.onclick=()=>{picker.hidden=false;send(picker,'reset')};
window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==picker.contentWindow)return;let d=e.data;if(typeof d==='string')try{d=JSON.parse(d)}catch{return};if(d.demo==='requests')document.getElementById('requests').textContent='确认请求次数：'+d.count;if(d.action==='bill'){picker.hidden=true;preview.contentWindow.postMessage(JSON.stringify({action:'billDetails',data:d.data}),location.origin)}});
</script></html>
