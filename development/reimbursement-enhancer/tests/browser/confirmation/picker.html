<!doctype html><html lang="zh-CN"><meta charset="utf-8"><link rel="stylesheet" href="/extension/polish.css"><style>body{margin:0;font:16px system-ui;color:#253247}#app{padding:20px}h3{margin:0 0 18px}.cards{display:flex;gap:12px}.card{padding:24px;border:1px solid #ddd;border-radius:5px;background:#fafcff}.file-fixed{position:fixed;bottom:12px;left:15px;right:15px;height:50px;display:flex;align-items:center;justify-content:space-between;border-top:1px solid #ddd;background:white}.ant-btn{padding:10px 16px;font:16px system-ui;border:1px solid #ddd;border-radius:4px;margin-left:4px;background:white}.ant-btn-primary{background:#328bff;color:white;border-color:#328bff}.ant-btn:disabled{opacity:.65}.selected{min-width:0;font-size:14px}@media(max-width:450px){.cards{flex-wrap:wrap}.card{padding:12px}.ant-btn{padding:10px 8px}.selected{max-width:44%}}</style>
<div id="app"><h3>发票夹 · 已选择 34 张合成票据</h3><p>点击“确定”，再通过演示控制按钮完成请求。</p><div class="cards"><div class="card">☑ 城市间交通</div><div class="card">☑ 住宿发票</div><div class="card">☑ 其他票据</div></div><div class="file-fixed"><span class="selected">已选择 <b id="count">34</b> 张</span><div><button class="ant-btn">取消</button><button id="confirm" class="ant-btn ant-btn-primary"><span>确 定</span></button></div></div></div>
<script>
window.chrome={storage:{local:{get:async defaults=>defaults},onChanged:{addListener(){}}}};
let resolve,reject,requests=0;const bills=Array.from({length:34},(_,id)=>({id:'synthetic-'+id})),proto={};Object.defineProperty(proto,'$http',{get:()=>function(){requests++;parent.postMessage({demo:'requests',count:requests},location.origin);return new Promise((res,rej)=>{resolve=res;reject=rej})},configurable:false});
const component=Object.assign(Object.create(proto),{$el:document.getElementById('app'),checkedValues:bills.map(b=>b.id),$children:[],$forceUpdate(){},onSubmit(){return this.$http({url:'/bill-wallet/bill/manage/confirmSelectBills2.json',data:{billDatas:this.checkedValues}}).then(r=>{if(r.success){this.checkedValues=[];document.getElementById('count').textContent='0';parent.postMessage(JSON.stringify({action:'bill',data:r.data}),location.origin)}},()=>{})}});document.getElementById('app').__vue__=component;const confirmButton=document.getElementById('confirm');confirmButton.onclick=()=>component.onSubmit.apply(null,[]);
window.addEventListener('message',e=>{if(e.source!==parent||e.origin!==location.origin)return;if(e.data.demo==='success')resolve?.({success:true,data:bills});if(e.data.demo==='failure')reject?.(Error('演示请求失败'));if(e.data.demo==='reset'){component.checkedValues=bills.map(b=>b.id);document.getElementById('count').textContent='34';confirmButton.disabled=false}});
</script><script src="/extension/site.js"></script><script src="/extension/wallet-bridge.js"></script><script src="/extension/wallet-feedback.js"></script></html>
