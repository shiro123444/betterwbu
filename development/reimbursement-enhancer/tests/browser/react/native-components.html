<!doctype html>
<html lang="zh-CN" data-re-visual="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原生组件衔接 · 本地预览</title>
<style>

-number-handler{display:block;text-align:center;height:50%;line-height:14px;color:#999}.ant-btn{border:1px solid #ddd;background:white;border-radius:4px;font:14px system-ui;padding:6px 12px;cursor:pointer}.anticon{display:inline-block;width:16px;line-height:16px;margin-right:4px}.ant-btn-primary{background:#2878ff;color:white}.btn{display:flex;gap:8px;margin-bottom:12px}table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:12px;border-bottom:1px solid #eee}th{color:#999;background:#f7f8fa;font-weight:400}.behavior-detail-btn{color:#1677ff}.ant-select-dropdown{margin-top:12px;background:white;border:1px solid #ddd}.ant-select-dropdown-menu-item{padding:6px 10px;cursor:pointer}.ant-select-dropdown-menu-item-active{background:#eee}.preview-options{margin-bottom:20px}.preview-options summary{cursor:pointer;color:#687385}#notice{min-height:24px;color:#687385}@media(max-width:700px){.layout-content{padding:16px}.ant-col-12{width:100%}.ant-form-item{padding:0}.top-desc{gap:12px}.top-desc h1{font-size:20px}.top-desc strong{font-size:22px}}
</style>
<link rel="stylesheet" href="../../../extension/polish.css"><link rel="stylesheet" href="../../../extension/workspace.css"><link rel="stylesheet" href="../../../extension/components.css">
<script>
const nativeOnly=new URLSearchParams(location.search).has('native');if(nativeOnly)document.documentElement.dataset.reVisual='false';
window.chrome={storage:{local:{get:async defaults=>({...defaults,enabled:!nativeOnly,visual:!nativeOnly})},onChanged:{addListener(){}}}};

</script></head><body>
<header><img src="assets/wbu-logo.png" alt="武汉商学院" width="240" height="56"></header>
<main class="layout-content"><div class="reimbursementCreate">
<div class="top-desc"><div><h1>差旅费报销单</h1><p>待提交</p></div><strong>¥ 1,380.00</strong></div>
<section class="collapse-box"><div class="ant-collapse-item"><div class="ant-collapse-header" role="button" tabindex="0" aria-expanded="true"><span class="ant-collapse-arrow" aria-hidden="true">⌄</span><p><span>基本信息</span></p></div><div class="ant-collapse-content"><div class="ant-collapse-content-box"><form class="ant-form"><div class="ant-row">
<div class="ant-col ant-col-12"><div class="ant-form-item"><div class="ant-form-item-label"><label for="name">报销人</label></div><div class="ant-form-item-control"><input id="name" class="ant-input" value="示例教师" autocomplete="off"></div></div></div>
<div class="ant-col ant-col-12"><div class="ant-form-item"><div class="ant-form-item-label"><label for="department">报销人部门</label></div><div class="ant-form-item-control"><div class="ant-select"><div id="department" class="ant-select-selection ant-select-selection--single" role="combobox" tabindex="0" aria-label="报销人部门" aria-expanded="false"><div class="ant-select-selection__rendered"><div class="ant-select-selection-selected-value">人工智能与大数据学院</div></div><span class="ant-select-arrow" aria-hidden="true">⌄</span></div></div></div></div></div>
<div class="ant-col ant-col-12"><div class="ant-form-item"><div class="ant-form-item-label"><label for="date">开始日期</label></div><div class="ant-form-item-control"><span class="ant-calendar-picker"><input id="date" class="ant-calendar-picker-input ant-input" value="2026-01-01" autocomplete="off"><span class="ant-calendar-picker-icon" aria-hidden="true">▦</span></span></div></div></div>
<div class="ant-col ant-col-12"><div class="ant-form-item"><div class="ant-form-item-label"><label for="amount">核准金额</label></div><div class="ant-form-item-control"><div class="ant-input-number"><input id="amount" class="ant-input-number-input" value="600.00" inputmode="decimal"><div class="ant-input-number-handler-wrap" aria-hidden="true"><span class="ant-input-number-handler">⌃</span><span class="ant-input-number-handler">⌄</span></div></div></div></div></div>
</div></form><details class="preview-options"><summary>查看下拉选项样式</summary><div class="ant-select-dropdown" role="listbox" aria-label="部门"><div class="ant-select-dropdown-menu-item ant-select-dropdown-menu-item-active" role="option" aria-selected="true">人工智能与大数据学院</div><div class="ant-select-dropdown-menu-item" role="option" aria-selected="false">教务处</div></div></details></div></div></div></section>
<section class="collapse-box"><div class="ant-collapse-item"><div class="ant-collapse-header" role="button" tabindex="0" aria-expanded="true"><span class="ant-collapse-arrow" aria-hidden="true">⌄</span><span class="ant-collapse-header-text">费用明细</span><span class="ant-collapse-extra"><span class="behaviorNum">¥ 1,380.00</span></span></div><div class="ant-collapse-content"><div class="ant-collapse-content-box"><div class="btn"><button class="ant-btn" type="button">新增明细</button></div><div class="ant-table-content"><table class="ant-table"><thead><tr><th>姓名</th><th>金额</th><th>操作</th></tr></thead><tbody><tr><td>示例教师</td><td>600.00</td><td><button type="button" class="ant-btn" id="add-row"><span class="anticon anticon-plus-circle" aria-label="plus-circle">＋</span></button> <button type="button" class="ant-btn" id="copy-row"><span class="anticon anticon-copy" aria-label="copy">▣</span></button> <button type="button" class="ant-btn" id="delete-row"><span class="anticon anticon-delete" aria-label="delete">×</span></button> <button type="button" class="ant-btn" id="detail-row"><span class="behavior-detail-btn">详情</span></button></td></tr></tbody></table></div></div></div></div></section>
<div id="notice" role="status"></div>
</div></main>
<script>
for(const h of document.querySelectorAll('.ant-collapse-header'))h.onclick=()=>{const next=h.getAttribute('aria-expanded')!=='true';h.setAttribute('aria-expanded',String(next));h.nextElementSibling.classList.toggle('ant-collapse-content-inactive',!next)};
for(const [id,key]of [['detail-row','details'],['copy-row','copy'],['add-row','add'],['delete-row','remove']])document.getElementById(id).onclick=()=>{window.previewCounts[key]++;document.getElementById('notice').textContent='本地操作：'+key+' '+window.previewCounts[key]};
</script><script src="../../../extension/workspace.js"></script><script src="../../../extension/actions.js"></script></body></html>
