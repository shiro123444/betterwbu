<!doctype html>
<html lang="zh-CN" data-re-visual="true" data-bw-ui="true" data-bw-motion="false"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>填报助手与侧栏预览</title>
<link rel="stylesheet" href="../../../extension/workspace.css"><link rel="stylesheet" href="../../../extension/components.css">
<style>
.native-icon{display:none!important}
*{box-sizing:border-box}body{margin:0;background:#f3f6fa;color:#253247;font:16px/1.6 system-ui,"Microsoft YaHei",sans-serif}header{height:76px;background:#1670ee;color:white;padding:12px 24px;display:flex;align-items:center;justify-content:space-between}header img{width:220px;height:50px;object-fit:contain}header small{font-size:14px;opacity:.9}.demo-layout{display:flex;height:calc(100dvh - 76px)}.ant-layout-sider{width:200px;flex:0 0 200px;background:#fff;border-right:1px solid #e2e6ec;overflow:auto}.ant-layout-sider-children{padding:12px 8px}.ant-menu{list-style:none;margin:0;padding:0}.ant-menu-submenu{margin:8px 0}.ant-menu-submenu-title{padding:12px;background:#f8fafc;border:1px solid #e7ecf2;border-radius:8px;min-height:64px;display:flex;align-items:center;gap:10px}.ant-menu-title-content{font-size:15px}.native-icon{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;color:#1765e8;background:#e7effd;border-radius:6px}.demo-main{padding:36px;flex:1;min-width:0;overflow:auto}.demo-heading{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.demo-heading h1{font-size:24px;margin:0}.demo-heading p{color:#687385;font-size:14px;margin:6px 0}.demo-heading strong{font-size:28px;white-space:nowrap}.demo-card{background:#fff;border:1px solid #e2e6ec;border-radius:8px;padding:24px;margin-bottom:20px}.demo-card h2{font-size:18px;margin:0 0 20px}.demo-fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}.demo-fields label{font-size:14px;color:#687385}.demo-fields input{display:block;width:100%;margin-top:8px;padding:12px;border:1px solid #e2e6ec;border-radius:8px;font:16px system-ui;color:#334155;background:#f8fafc}.demo-main ol{padding-left:24px;color:#526075}.demo-note{font-size:14px;color:#687385}@media(max-width:600px){header{padding:12px}header img{width:170px}header small{display:none}.demo-main{padding:20px 14px}.demo-heading{align-items:flex-start;flex-direction:column;gap:4px}.demo-card{padding:16px}.demo-fields{grid-template-columns:1fr}.demo-heading h1{font-size:20px}}
</style></head><body>
<header><img src="assets/wbu-logo.png" alt="武汉商学院"><small>BetterWBU · 合成数据预览</small></header>
<div class="demo-layout"><aside class="ant-layout-sider"><div class="ant-layout-sider-children"><div class="menuBox"><button class="shrinkIcon" type="button">收起</button><button class="shrinkIcon2" type="button">展开</button><ul class="ant-menu ant-menu-root" role="menu"><li class="ant-menu-submenu"><div class="ant-menu-submenu-title" data-menu-id="报账管理"><span class="native-icon">▤</span><span class="ant-menu-title-content">报账管理</span></div></li><li class="ant-menu-submenu"><div class="ant-menu-submenu-title" data-menu-id="待办中心"><span class="native-icon">✓</span><span class="ant-menu-title-content">待办中心</span></div></li></ul></div></div></aside>
<main class="demo-main"><div class="demo-heading"><div><h1>差旅费报销单</h1><p>待提交 · 合成示例</p></div><strong>¥ 1,380.00</strong></div><section class="demo-card"><h2>基本信息</h2><div class="demo-fields"><label>出差类型<input readonly value="常规差旅"></label><label>食宿情况<input readonly value="不包食宿"></label><label>出差开始日期<input readonly value="2026-10-17"></label><label>出差结束日期<input readonly value="2026-10-19"></label></div></section><section class="demo-card"><h2>从左侧完成填报检查</h2><ol><li>打开第三个栏目“填报助手”。</li><li>“状态与预检”显示当前单据的状态、金额及待核对问题。</li><li>“同步与恢复”集中放置原有的备份、填报和恢复功能。</li></ol><p class="demo-note">此页只演示插件界面，所有数据和响应都保存在当前页面内，不连接学校系统。</p></section></main></div>
<script>
const settingListeners=[];
window.chrome={storage:{local:{get:async defaults=>({...defaults,enabled:true,visual:true})},onChanged:{addListener:fn=>settingListeners.push(fn)}},runtime:{sendMessage:async()=>({ok:true})}};
document.querySelector('.shrinkIcon').onclick=()=>document.querySelector('aside').classList.add('ant-layout-sider-collapsed');
document.querySelector('.shrinkIcon2').onclick=()=>document.querySelector('aside').classList.remove('ant-layout-sider-collapsed');
window.previewRequests=[];
window.addEventListener('message',event=>{
 if(event.source!==window||event.data?.type!=='reimbursement-fill-request')return;
 const m=event.data;window.previewRequests.push(m.action);
 const data=m.action==='status'?{scope:'preview|teacher',draftId:'demo',eligible:true,available:true,fillRecorded:true}:{report:{draftId:'demo',state:2,stateName:'待提交',fillRecorded:true,total:138000,expenseTotal:138000,receiptTotal:138000,printTotal:null,auditKnown:true,violations:1,warnings:0,issues:[],currentDetailIssues:[{message:'常规差旅 / 城市间交通费 / 第1行：尚有票据待关联，请核对后补全。'}],detailIssues:[{message:'常规差旅 / 城市间交通费 / 第1行：尚有票据待关联，请核对后补全。'}]}};
 window.postMessage({type:'reimbursement-fill-reply',id:m.id,ok:['status','server-status'].includes(m.action),error:'合成预览不执行填报操作',...data},location.origin);
});
</script><script src="../../../extension/fill-compat-ui.js"></script><script src="../../../extension/workspace.js"></script></body></html>
