<!doctype html><html lang="zh-CN" data-bw-ui="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>表格字段宽度回归</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;font:16px/1.5 system-ui;color:#252d3a}header{background:#087cff;color:white;padding:20px 32px;font-size:20px}main{padding:24px;container-type:inline-size}section{padding:20px;background:white;margin-bottom:20px}h2{margin:0 0 20px;font-size:20px}.ant-row{display:flex;flex-wrap:wrap}.ant-col-12{width:50%}.ant-form-item-control-input{display:flex;min-height:32px}.ant-form-item-control-input-content{flex:auto;max-width:100%}.ant-input,.ant-input-number,.ant-calendar-picker,.ant-select{width:100%;border:1px solid #d8dee7;border-radius:4px;color:inherit;background:white}.ant-input{padding:9px 12px;font:16px/1.5 system-ui}.ant-input-number-input{width:100%;border:0;padding:9px 12px;font:14px/1.5 system-ui}.ant-calendar-picker{display:inline-block;position:relative;border:0}.ant-calendar-picker-input{padding-right:32px}.ant-calendar-picker:after{content:'▦';position:absolute;right:10px;top:12px;color:#687385}.ant-select-selection{padding:9px 12px;min-height:44px}.ant-table{width:100%;border-collapse:collapse;table-layout:fixed}.ant-table th,.ant-table td{padding:12px;border-bottom:1px solid #e8ebf0;text-align:left}.ant-table th{font-size:14px;color:#687385;background:#f7f8fa}.ant-table-content{overflow:auto}.ant-table table{width:1420px}.ant-form-item{margin:0}.ant-input-number-disabled{background:#f7f8fa}.bw-row-actions button{font:inherit}
</style><link rel="stylesheet" href="../../../extension/workspace.css"></head><body>
<header>武汉商学院网上报销系统 · 表格布局验证</header><main data-bw-workspace>
<section class="collapse-box"><h2>基本信息</h2><form class="ant-form"><div class="ant-row" id="basic-grid"><div class="ant-col ant-col-12"><div class="ant-form-item"><div class="ant-form-item-label">经办人</div><div class="ant-form-item-control"><input class="ant-input" value="示例教师"></div></div></div><div class="ant-col ant-col-12"><div class="ant-form-item"><div class="ant-form-item-label">经办人部门</div><div class="ant-form-item-control"><input class="ant-input" value="人工智能与大数据学院"></div></div></div></div></form></section>
<section class="collapse-box"><h2>费用明细</h2><div class="table-level2-box"><div class="ant-table-content"><table class="ant-table"><colgroup><col style="width:60px"><col style="width:240px"><col style="width:280px"><col style="width:140px"><col style="width:180px"><col style="width:180px"><col style="width:160px"><col style="width:180px"></colgroup><thead class="ant-table-thead"><tr><th>序号</th><th>姓名</th><th>补贴地</th><th>标准</th><th>开始日期</th><th>结束日期</th><th>金额</th><th>操作</th></tr></thead><tbody class="ant-table-tbody" id="rows"></tbody></table></div></div></section>
<section class="collapse-box"><h2>收付款信息</h2><div class="ant-table-content"><table class="ant-table"><colgroup><col style="width:260px"><col style="width:440px"><col style="width:440px"><col style="width:280px"></colgroup><thead class="ant-table-thead"><tr><th>账户名称</th><th>开户行</th><th>收款账号</th><th>应收金额</th></tr></thead><tbody class="ant-table-tbody" id="recipient-rows"></tbody></table></div></section>
<output id="layout-result"></output></main><script>
function field(control){return `<form class="ant-form ant-form-horizontal" style="position:relative"><div class="ant-row ant-form-item" style="row-gap:0"><div class="ant-col ant-form-item-control"><div class="ant-form-item-control-input"><div class="ant-form-item-control-input-content">${control}</div></div></div></div></form>`}
const text=value=>`<div class="table-cell" style="max-width:400px"><div><input class="ant-input" value="${value}"></div></div>`;
const number=value=>`<div class="table-cell ant-input-number ant-input-number-disabled" style="width:100%;max-width:400px"><div class="ant-input-number-input-wrap"><input class="ant-input-number-input" value="${value}" disabled></div></div>`;
const date=value=>`<span class="table-cell ant-calendar-picker" style="width:100%;max-width:400px"><div><input class="ant-calendar-picker-input ant-input" value="${value}"></div></span>`;
document.querySelector('#rows').innerHTML=[['示例教师甲、示例教师乙','黑龙江省/哈尔滨市/道里区'],['示例教师丙','黑龙江省/哈尔滨市/道里区']].map(([name,place],i)=>`<tr><td>${i+1}</td><td>${field(text(name))}</td><td>${field(text(place))}</td><td>${field(number('80.00'))}</td><td>${field(date('2026-07-23'))}</td><td>${field(date('2026-07-26'))}</td><td>${field(number('320.00'))}</td><td><div class="bw-row-actions"><button class="bw-button">详情</button><button class="bw-button bw-icon-button">…</button></div></td></tr>`).join('');
document.querySelector('#recipient-rows').innerHTML=`<tr><td>${field(text('示例教师甲'))}</td><td>${field('<div class="ant-select"><div class="ant-select-selection">示例银行武汉分行</div></div>')}</td><td>${field(text('0000000000000000000'))}</td><td>${field(number('10261.00'))}</td></tr>`;
if(new URLSearchParams(location.search).has('readonly'))for(const n of document.querySelectorAll('input,button'))n.disabled=true;
window.checkTableLayout=()=>{const failures=[];for(const input of document.querySelectorAll('td input,td .ant-select')){const form=input.closest('form'),content=input.closest('.ant-form-item-control-input-content');if(content.getBoundingClientRect().width<form.getBoundingClientRect().width-1)failures.push('field shrunk');if(input.classList.contains('ant-calendar-picker-input')&&input.getBoundingClientRect().width<150)failures.push('date clipped');}if(document.documentElement.scrollWidth>innerWidth+1)failures.push('page overflow');return {passed:!failures.length,failures,basicColumns:getComputedStyle(document.querySelector('#basic-grid')).gridTemplateColumns,fields:document.querySelectorAll('td input,td .ant-select').length};};
</script></body></html>
