<!doctype html><html lang="zh-CN" data-bw-wallet-modern data-re-wallet-picker="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>发票夹伸缩布局 · 合成验证</title><link rel="stylesheet" href="../../../extension/polish.css"><link rel="stylesheet" href="../../../extension/wallet-manager.css"><link rel="stylesheet" href="../../../extension/wallet-recognition.css"><style>
html,body{height:100%;margin:0;overflow:hidden;font:14px/1.5 system-ui;color:#29374b}.fixture-banner{height:42px;box-sizing:border-box;padding:9px 16px;background:#edf4ff;color:#426993}html[data-re-wallet-picker] .file-page{height:calc(100dvh - 42px)!important}.file-tabs{display:flex}.file-content-wrap{display:flex;flex-direction:column;overflow:hidden}.file-checkbox-group{display:flex;flex-direction:column;overflow:hidden}.ant-spin-nested-loading{flex:1;min-height:0}.ant-spin-container{height:100%}.file-list{height:100%;overflow:auto}.fixture-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(180px,100%),1fr));gap:12px;padding:4px}.fixture-card{border:1px solid #dfe6ef;border-radius:10px;background:white;overflow:hidden;min-width:0}.fixture-image{height:135px;background:#f5f8fc;display:grid;place-items:center;color:#91a5c0}.fixture-card p{margin:10px}.file-tips-wrap{font-size:13px;background:#f2f7ff;padding:6px 10px;border-radius:6px}.file-bottom-tool{font-size:12px;color:#738097}.tabs-tool button{border:1px solid #dce3ee;border-radius:7px;background:white;padding:7px 12px;color:#465a76}.file-search{display:none}.file-search.open{display:block}.fixture-filter{height:220px;background:#f6f8fb;padding:10px}
</style></head><body><header class="fixture-banner">合成布局验证 · 40 条识别结果 · 不连接学校，不上传或修改票据</header><main class="file-page"><aside class="bw-wallet-sidebar"><div class="bw-wallet-sidebar-title"><strong>我的文件夹</strong><button class="bw-wallet-button">+ 新建</button></div><input class="bw-wallet-folder-search" placeholder="搜索文件夹"><nav class="bw-wallet-folders" id="folders"></nav></aside><div class="file-tips-wrap">票据提示会保持紧凑，详细状态可按需展开</div><div class="file-search"><div class="fixture-filter">筛选条件测试区：面板限高并独立滚动</div></div><section class="file-content-wrap"><div class="file-tabs"><section class="bw-wallet-heading"><div><h1>差旅票据</h1><p class="bw-wallet-muted">20 张测试票据</p></div><div class="bw-wallet-heading-tools"><button class="bw-wallet-button">重命名</button><button class="bw-wallet-button">刷新</button></div></section><div class="tabs-tool"><button id="filter">筛选</button><button>排序</button><button>批量编辑</button><button>＋ 添加票据</button></div></div><div class="file-checkbox-group"><div class="ant-spin-nested-loading"><div class="ant-spin-container"><div class="file-list"><div class="fixture-cards" id="cards"></div></div></div></div></div></section><footer class="file-bottom-tool">布局验证：拖动文件夹栏右边界，展开详情后拖动面板底边；方向键可微调，双击恢复。</footer></main><script>
const preferences={};window.chrome={storage:{local:{get:async defaults=>({...defaults,...preferences}),set:async values=>Object.assign(preferences,values)},onChanged:{addListener(){}}}};
for(let i=0;i<25;i++){const b=document.createElement('button');b.className='bw-wallet-button bw-wallet-folder';b.textContent=['发票夹','会议材料','差旅票据'][i%3]+' '+(i+1);document.querySelector('#folders').append(b)}
for(let i=0;i<20;i++){const card=document.createElement('article');card.className='fixture-card';card.innerHTML='<div class="fixture-image">票据预览</div><p>测试票据 '+(i+1)+'</p><p>¥ 100.00</p>';document.querySelector('#cards').append(card)}
document.querySelector('#filter').onclick=()=>document.querySelector('.file-search').classList.toggle('open');
</script><script src="../../../extension/wallet-panels.js"></script><script src="../../../extension/wallet-recognition-ui.js"></script><script>
window.postMessage({type:'reimbursement-recognition-state',canRefresh:true,rows:Array.from({length:40},(_,i)=>({name:i===4?'很长的文件名用于验证窄窗口时不会撑破面板的测试票据.pdf':'测试票据 '+(i+1)+'.pdf',phase:i<2?'processing':i===2?'delayed':'recognized',present:i<3,seconds:31}))},location.origin);
</script></body></html>
