<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>票据识别状态 · 合成验证</title><link rel="stylesheet" href="../../../extension/wallet-recognition.css"><style>body{margin:0;background:#f5f6f8;font:16px/1.6 system-ui;color:#252d3a}main{max-width:1000px;margin:32px auto;padding:24px}h1{font-size:24px}.notice{padding:16px;background:#edf4ff;border-radius:8px}.controls{display:flex;flex-wrap:wrap;gap:16px;align-items:center;margin:24px 0}select,button{font:inherit;padding:8px 12px}.file-item{width:240px;padding:12px;border:1px solid #ddd;border-radius:8px;background:white}.file-image{height:130px;background:#f2f3f5;position:relative}.file-name{position:absolute;bottom:0;background:#888;color:white;width:100%}.preview-img{width:50px;height:50px;animation:rotate 2s linear infinite}.file-item em{font-style:normal;color:#687385}.query-log{padding:12px 0;color:#687385}@keyframes rotate{to{transform:rotate(360deg)}}@media(max-width:540px){main{padding:16px;margin:0}.controls{align-items:flex-start;flex-direction:column}}</style></head><body><main><h1>票据识别状态</h1><p class="notice">合成测试，不连接学校系统，不上传文件，不保存或提交报销单。</p><div class="controls"><label>模拟后台结果 <select id="result"><option value="waiting">仍在识别</option><option value="missing">任务消失，无票据结果</option><option value="recognized">返回对应票据</option><option value="duplicate">返回重复票</option><option value="error">查询失败</option></select></label><button id="reset">重置测试票据</button></div><div class="file-content-wrap" id="native"></div><p class="query-log" id="log">只读查询 0 次 · 保存、提交、删除、上传 0 次</p></main><script>
location.hash='#/bill/file';window.chrome={storage:{local:{get:async()=>({enabled:true,wallet:true})},onChanged:{addListener(){}}}};
let queryCount=0;const host=document.querySelector('#native'),vm={$el:host,$children:[],sourceData:[],condition:{folderId:'synthetic'},page:{currentPage:1,pageSize:20},checkedValues:[],allUploadFiles:[],uploadFileList:[],loading:false,spinning:false,$nextTick:async()=>{}};
function reset(){vm.sourceData=[{id:'test-task',barcode:'T-TEST',fileName:'测试行程单.pdf',billType:'unident',createTs:new Date(Date.now()-180000).toISOString()}];host.querySelector('.file-item')?.remove();let card=document.createElement('div');card.className='file-item';card.innerHTML='<div class="file-image"><img class="preview-img" alt=""><div class="file-name">识别中</div></div><p>测试行程单.pdf</p><div><em>T-TEST</em></div>';host.append(card);window.ReimbursementRecognitionMonitor?.inspect()}
Object.setPrototypeOf(vm,Object.defineProperty({},'$http',{get(){return config=>new Promise((resolve,reject)=>{queryCount++;document.querySelector('#log').textContent='只读查询 '+queryCount+' 次 · 保存、提交、删除、上传 0 次';setTimeout(()=>{const mode=document.querySelector('#result').value;if(mode==='error')return reject(Error('Synthetic network error'));resolve({success:true,data:{unIdentInstanceVOList:mode==='waiting'?vm.sourceData:[],billCardList:['recognized','duplicate'].includes(mode)?[{id:'test-invoice',parentBarcode:'T-TEST',ticketCode:'1-033',isHasRepeat:mode==='duplicate'?'1':'0'}]:[]}})},150)})}}));
vm.getInfo=function(){this.spinning=true;this.$http({url:'/bill-wallet/bill/manage/findBillFolderCardList.json',method:'post'}).then(r=>{this.spinning=false;this.sourceData=[...r.data.unIdentInstanceVOList,...r.data.billCardList];if(!r.data.unIdentInstanceVOList.length)host.querySelector('.file-item')?.remove()}).catch(()=>{this.spinning=false})};document.querySelector('#reset').onclick=reset;document.querySelector('#app')?.remove();let app=document.createElement('div');app.id='app';app.__vue__=vm;document.body.append(app);reset();
</script><script src="../../../extension/site.js"></script><script src="../../../extension/wallet-recognition-core.js"></script><script src="../../../extension/wallet-recognition.js"></script><script src="../../../extension/wallet-recognition-ui.js"></script></body></html>
