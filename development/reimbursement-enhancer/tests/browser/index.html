<!doctype html><html lang="zh-CN" data-re-visual="true"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>报销插件修复验证</title><link rel="stylesheet" href="../../extension/polish.css"><style>
*{box-sizing:border-box}body{margin:0;font:15px/1.6 system-ui;background:#f4f6f8;color:#333}header{height:80px;padding:20px;background:#075197;color:white;display:flex;align-items:center;justify-content:space-between}button{cursor:pointer}header button{padding:8px 12px}.content-box{margin-left:185px}.layout-content{width:100%;padding:20px}.collapse-box{padding:20px;background:white}.ant-btn{height:32px;padding:4px 15px;border:1px solid #ddd;border-radius:4px;background:white;margin-right:15px}.ant-btn-primary{background:#2878ff;color:white}.button-box{position:fixed;left:192px;bottom:12px;width:calc(100% - 206px);height:82px;display:flex;align-items:center;justify-content:flex-end;padding:5px 0;background:#fff;white-space:nowrap;z-index:10}.button-box .fr{display:block}.manager{position:fixed;right:0;top:80px;bottom:0;width:400px;background:#fff;border-left:1px solid #ddd;padding:20px;z-index:20}.manager[hidden]{display:none}.fixture-note{color:#777;font-size:13px}#details>div{display:flex;gap:16px;padding:12px;border-bottom:1px solid #eee}#details>div>span:first-child{width:160px}#total{font-size:22px;color:#1765e8}h2{font-size:18px}@media(max-width:700px){.layout-content{padding:12px}.collapse-box{padding:12px}.button-box{left:40px;width:calc(100% - 60px)}}
</style></head><body><header><strong>报销插件修复验证</strong><button id="sidebar">信息管理</button></header><aside class="manager" hidden>信息管理侧栏（400px）</aside><div class="content-box"><main class="layout-content"><div class="reimbursementCreate"><div class="custom-forms-render commit-bill"><p class="fixture-note">合成票据与原生方法模拟，用于验证界面和生成流程；不会提交任何报销数据。</p><section class="collapse-box"><h2>影像信息</h2><button class="ant-btn fileFold">发票夹</button><p>合成发票 2844.00 元；三张负数支付截图为辅助材料，不抵消发票金额。补贴按你确认的行程另计。</p></section><section class="collapse-box"><h2>费用明细</h2><div id="details">尚无费用明细</div><p>报销单总金额：<strong id="total">0.00</strong> 元</p></section></div><div class="button-box"><div class="fr"><button class="ant-btn" data-re-action="secondary">暂存</button><button class="ant-btn" disabled>重新生成</button><button class="ant-btn ant-btn-primary" data-re-action="primary">提交</button></div></div></div></main></div>
<script src="../../extension/core.js"></script><script src="../../extension/invoice-core.js"></script><script src="../../extension/invoices.js"></script><script src="../../extension/layout.js"></script><script>
const form={formId:'c3771358d145490f9e363790c0519fde',reimbursementId:'synthetic',state:2,totalAmount:'0.00',totalAmountOrigin:'0.00',billVOList:[{barcode:'synthetic-train',totalAmount:'2000.00',ticketName:'铁路电子客票',billTitle:'合成火车票',billData:{trainNO:'G123'}},{barcode:'synthetic-hotel',totalAmount:'844.00',ticketName:'增值税普通发票',billTitle:'合成住宿发票',billData:{hotel:[{}]}},{barcode:'synthetic-refund-1',totalAmount:'-566.92',ticketName:'支付截图',billTitle:'合成退款截图一'},{barcode:'synthetic-refund-2',totalAmount:'-634.92',ticketName:'支付截图',billTitle:'合成退款截图二'},{barcode:'synthetic-refund-3',totalAmount:'-840.00',ticketName:'支付截图',billTitle:'合成退款截图三'},{barcode:'synthetic-note',totalAmount:'0',ticketName:'情况说明',billTitle:'情况说明'}]};
const templates=[{activityMetaId:'travel',activityMetaName:'常规差旅',ASX060401:'0.00',behaviors:['城市间交通费','住宿','其他','用餐补贴','市内交通补贴'].map((name,i)=>({behaviorMetaName:name,behaviorMetaId:String(i),BSX060206:'0.00',behaviorDetail:[{option:{list:['BSX070306','BSX070303','BSX070110','BTSSX0402','BTSSX0403','BTSSX0404','BTSSX0409','BSX071301','BTSSX0412'].map(key=>({option:{key}}))}}]}))}];
const api=window.ReimbursementInvoiceTools;
const main={subTree:{el:document.querySelector('.collapse-box')},props:{componentInfo:{key:'activitys'}},setupState:{form,isEdit:{data:true},activityOptionList:templates,onAddTableList:a=>{form.activitys||=[];form.activitys.push(a)}}};
function refresh(){for(const a of form.activitys||[])api.register({subTree:{el:document.querySelector('#details')},props:{tableRecord:a},setupState:{isEdit:{data:true},onAddBehaviorList:b=>a.behaviors.push(b),onAddTableList:b=>b.behaviorDetail.push({key:crypto.randomUUID()})}});const details=document.querySelector('#details');details.replaceChildren();for(const a of form.activitys||[])for(const b of a.behaviors)for(const r of b.behaviorDetail){const line=document.createElement('div');for(const text of [b.behaviorMetaName,Number(r.BSX070306).toFixed(2)+' 元',r.BSX070110]){const span=document.createElement('span');span.textContent=text;line.append(span)}details.append(line)}document.querySelector('#total').textContent=Number(form.totalAmount).toFixed(2);api.mount()}
api.bind({form:()=>form,settings:{enabled:true,totals:true},raw:x=>x,nextTick:()=>Promise.resolve(),refresh,compute:f=>{for(const p of ReimbursementEnhancerCore.travelPlan(f))p.target[p.key]=(p.amount/100).toFixed(2);refresh()}});api.register(main);refresh();
document.querySelector('#sidebar').onclick=()=>{const open=document.documentElement.dataset.reManagerOpen!=='true';document.documentElement.dataset.reManagerOpen=String(open);document.querySelector('.manager').hidden=!open};
</script></body></html>
