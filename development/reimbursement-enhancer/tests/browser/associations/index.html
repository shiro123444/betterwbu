<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>票据关联与分摊 · 合成测试</title>
<link rel="stylesheet" href="../../../extension/polish.css">
<style>body{margin:0;background:#f4f6f9;font:16px/1.6 system-ui;color:#27364b}main{max-width:1100px;padding:32px;margin:auto}h1{font-size:24px}button{font:inherit;cursor:pointer;padding:10px 16px;border:1px solid #ccd8e7;border-radius:8px;background:white}table{width:100%;border-collapse:collapse;background:white}td,th{text-align:left;padding:14px;border-bottom:1px solid #edf0f5;overflow-wrap:anywhere}.reimbursementCreate{background:white;padding:24px;border-radius:8px}.results{margin-top:24px;overflow:auto}.notice{background:#eaf3ff;padding:14px 18px;border-radius:8px}pre{white-space:pre-wrap}#counts{font-size:20px}button[disabled]{opacity:.5;cursor:default}.re-invoice-tools{display:inline-flex;gap:12px;align-items:center;flex-wrap:wrap}.re-invoice-allocation-grid input{display:block}.re-invoice-dialog{max-width:calc(100vw - 24px)}.re-invoice-dialog::backdrop{background:rgba(30,44,64,.25)}@media(max-width:600px){main{padding:16px}.reimbursementCreate{padding:16px}.re-invoice-tools{display:flex;margin-top:12px}}</style>
<main><h1>票据关联与分摊</h1><p class="notice">合成测试：测试姓名和票据，不连接学校系统，不保存或提交报销单。</p>
<div class="reimbursementCreate"><h2>费用明细</h2><button class="fileFold">发票夹（合成票据）</button><div class="activity-root"></div><p id="counts"></p><div class="results"><table><thead><tr><th>分类</th><th>姓名</th><th>金额</th><th>关联票据及使用金额</th></tr></thead><tbody id="rows"></tbody></table></div></div>
<p id="audit"></p><button id="export">查看本地序列化结果</button><pre id="serialized"></pre></main>
<iframe class="iframe-box1" hidden srcdoc="<div id='app'></div>"></iframe>
<script>if(!location.hash)location.hash='#/reimbursementCreate'</script><script src="../../../extension/core.js"></script><script src="../../../extension/invoice-associations.js"></script><script src="../../../extension/invoice-core.js"></script><script src="../../../extension/invoices.js"></script>
<script>
const names=['测试甲','测试乙','测试丙'];
function bill(id,title,total,content,extra={}){return {id:'record-'+id,dataId:'record-'+id,barcode:id,ticketCode:'1-024',billTitle:title,ticketName:'电子发票（普通发票）',totalAmount:total,billData:{totalTax:'6.79',details:[{inx:'0',content,amount:(Number(total)-6.79).toFixed(2),taxAmount:'6.79'}],...extra}}}
const bills=[bill('out','去程保险票','120','航空意外险'),bill('back','返程保险票','120','航空意外险'),...names.map((name,i)=>bill('room-'+i,name+'住宿票','807','住宿费',{name,hotel:[{checkInDate:'2000-01-18',checkOutDate:'2000-01-21'}]})),...names.map((name,i)=>({id:'record-water-'+i,dataId:'record-water-'+i,barcode:'water-'+i,ticketCode:'4-081',billTitle:name+'住宿流水单',ticketName:'酒店住宿流水单',fileType:'1',totalAmount:'807',billData:{dateOfArrive:'20000118',dateOfDeparture:'20000121'}}))];
const readonly=new URLSearchParams(location.search).has('readonly');
const form={reimbursementId:'synthetic-draft',formId:'c3771358d145490f9e363790c0519fde',state:readonly?7:2,totalAmount:'2661.00',totalAmountOrigin:'2661.00',billVOList:bills,activitys:[{activityMetaId:'travel',ASX060401:'2661.00',behaviors:[{behaviorMetaName:'交通意外险',behaviorDetail:names.map((name,i)=>({id:'old-insurance-'+i,BTX_NAME:name,BSX070109:name,BSX070306:80}))},{behaviorMetaName:'住宿',behaviorDetail:[...names.map((name,i)=>({id:'old-hotel-'+i,BTX_NAME:name,BSX070109:name,BSX070306:807})),{id:'old-empty',BSX070306:0,BSX0709:[{id:'legacy-support',BSX070802:'record-water-0',BSX070807:'water-0',BSX070804:0,BSX070811:'0'}]}]}]}],receivableInfo:[{bankAccountName:'测试收款人',actualReceivableCurrency:2661}]};
const templates=[{activityMetaId:'travel',activityMetaName:'常规差旅',behaviors:['交通意外险','住宿'].map(behaviorMetaName=>({behaviorMetaName,behaviorMetaId:behaviorMetaName,behaviorDetail:[{option:{list:[['BTX_NAME','姓名'],['HOTEL_START','入住日期'],['HOTEL_END','离店日期'],['BSX070109','行为人'],['BSX070306','金额'],['BSX070303','核准含税金额'],['BSX070305','核准税额'],['BSX070110','说明']].map(([key,title])=>({option:{key,title}}))}}]}))}];
const instance={subTree:{el:document.querySelector('.activity-root')},props:{componentInfo:{key:'activitys'}},setupState:{form,isEdit:{data:!readonly},activityOptionList:templates,onAddTableList:a=>{(form.activitys||=[]).push(a)}}};
const api=ReimbursementInvoiceTools,core=ReimbursementEnhancerCore;let nativeIndex=0;
function render(){
 document.getElementById('counts').textContent='费用合计 ¥'+form.totalAmount+' · 收付款 ¥'+form.receivableInfo[0].actualReceivableCurrency.toFixed(2);
 const body=document.getElementById('rows');body.replaceChildren();let missing=0,linked=0;
 for(const a of form.activitys||[])for(const b of a.behaviors||[]){api.register({subTree:{el:document.querySelector('.activity-root')},props:{tableRecord:a},setupState:{isEdit:{data:!readonly},onAddBehaviorList:b=>a.behaviors.push(b),onAddTableList:b=>b.behaviorDetail.push({key:'native-'+(++nativeIndex)})}});for(const d of b.behaviorDetail||[]){const tr=document.createElement('tr');for(const value of [b.behaviorMetaName,d.BTX_NAME||d.BSX070109||'未填姓名',Number(d.BSX070306||0).toFixed(2),(d.BSX0709||[]).map(l=>l.BSX070807+' · ¥'+Number(l.BSX070804).toFixed(2)+(l.BSX070811==='0'?'（凭证）':'')).join('；')||'未关联']){const td=document.createElement('td');td.textContent=value;tr.append(td)}body.append(tr);if(Number(d.BSX070306)>0&&!d.BSX0709?.length)missing++;linked+=(d.BSX0709||[]).length}}
 document.getElementById('audit').textContent='本地关联检查：'+missing+' 条付费行缺少关联，'+linked+' 条关联记录（不是后台稽核结果）。';
}
api.bind({form:()=>form,settings:{enabled:true,totals:true},raw:x=>x,nextTick:()=>Promise.resolve(),watch:()=>()=>{},refresh:render,compute:f=>{for(const p of core.travelPlan(f))p.target[p.key]=(p.amount/100).toFixed(2);render()}});api.register(instance);render();api.mount();
document.getElementById('export').onclick=()=>document.getElementById('serialized').textContent=JSON.stringify(form,null,2);
document.querySelector('iframe').onload=()=>document.querySelector('iframe').contentDocument.querySelector('#app').__vue__={sourceData:bills};
</script></html>
